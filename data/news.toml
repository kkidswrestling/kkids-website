[[post]]
slug = "new-website"
date = 2026-10-06
title = "Northampton Wrestling launches its new home online"
summary = "Results, rosters, the Hall of Champions, and every state champion since 1955, all in one place."
photo = "hero-circle"
body = [
  "Northampton Wrestling has a new website. It brings the whole program, from the youth room to the varsity lineup, into one place.",
  "The Hall of Champions lists every District XI champion since 1948, every Northeast Regional champion, all 27 PIAA state champions, and every state medalist, along with the program's seven PIAA team titles and the 100-Win Club. Search any name to see that wrestler's titles, medals, and records.",
  "During the season, the site will carry the schedule, results after every match, and news from the varsity, junior high, and youth programs.",
]

[[post]]

title = "Banquet honors the 2025–26 Konkrete Kids"
summary = "Wenrich and Ballard named Outstanding Wrestlers; five seniors receive Charlie Lerch Memorial Scholarships."
photo = "senior-night"
body = [
  "The Northampton Area Wrestling Club honored the 2025–26 team at its annual awards banquet on April 2, 2026.",
  "State champions Brayden Wenrich and Gabe Ballard shared the Outstanding Wrestler award. Ben Schoeneberger was named Rookie of the Year, Zach Hartzell received the Future Star award, and Carter Chlebove was named Most Improved and Most Courageous.",
  "Chase Grabfelder, Daniel Herritt, Brandon McEntire, Matthew Sommer, and Trey Wagner received Charlie Lerch Memorial Scholarships. Wagner, who finished his career with 140 wins, earned the 40 Point Club's fourth-year scholarship.",

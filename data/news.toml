[[post]]
slug = "ballard-super-32-third"
date = 2026-10-26
title = "Gabe Ballard takes third at Super 32"
summary = "The senior beat the No. 1 seed in the consolation bracket, then won a rematch with the only wrestler who beat him to take third at 150 pounds."
links_title = "Read more"
links = [["SI: 2026 Super 32 recap and placewinners", "https://www.si.com/high-school/wrestling/2026-super-32-melvin-miller-wins-third-title-as-caleb-noble-dominates-and-upsets-rock-greensboro-01m5wk6z596j"], ["FloWrestling: Results from the 2026 Super 32 Challenge", "https://www.flowrestling.org/articles/16286690-results-from-the-2026-super-32-challenge"]]
photo = "ballard-raised"
body = [
  "Senior Gabe Ballard placed third at 150 pounds at Super 32, held October 24 and 25 at the Greensboro Coliseum in Greensboro, North Carolina. Super 32 is one of the toughest preseason tournaments in high school wrestling, and nearly 1,900 wrestlers registered this year.",
  "Ballard, the 2026 PIAA Class AAA Champion at 152 pounds, was the No. 2 seed at 150. He advanced through Saturday's early rounds and closed the day with a 7–1 decision over California's Adaias Ortiz in the round of 16. In Sunday's quarterfinals, he lost a 9–7 decision to Pennsylvania's Greyson Music.",
  "Ballard battled back through the consolation bracket, and in the consolation semifinals he beat the tournament's No. 1 seed, Ohio's Jason Dube. Dube is ranked No. 1 nationally at 150 by FloWrestling and won his match at Who's Number One in September.",
  "That win set up a third-place rematch with Music. This time Ballard controlled the match and won, 12–5.",
  "Arseni Kikiniou of Escondido, California, won the 150-pound title with a 4–1 sudden-victory decision over Indiana's Peyton Hornsby.",
]


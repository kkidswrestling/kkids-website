summary = "Two PIAA champions in the same year for the first time since 2004."
photo = "two-champs-2026"
body = [
  "Brayden Wenrich won the PIAA Class AAA title at 114 pounds and Gabe Ballard won at 152 at the Giant Center in Hershey, the first time since 2004 that Northampton crowned two state champions in the same year.",
  "Wenrich finished the season 36–1 as a sophomore. Ballard went 41–5 as a junior, with 114 takedowns and 238 team points. Senior Trey Wagner placed 7th at 139 for his third state medal, and Matthew Sommer (133) and Carter Chlebove (160) also qualified for states.",

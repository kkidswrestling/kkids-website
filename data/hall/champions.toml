["Whitey Chlebove"]
banner = "banner-whitey-chlebove"
story = [
  "Ian \"Whitey\" Chlebove won the 1994 PIAA Class AAA title at 130 pounds and finished his senior season a perfect 38–0.",
  "He was tested along the way. At the Christmas City Tournament he edged AA state place winner Placido Salamone of Pen Argyl 5–3, and in February he beat fellow unbeaten Sean Topping 3–2 in the dual with Nazareth. He won the District XI final 8–4 over Easton's Brad Weaver, beat Weaver again for the Northeast Regional title, and went 4–0 at Hershey: a technical fall over Randy Dischner of Shaler, a major decision over Ryan Abbott of DuBois, a 2–1 semifinal over Chuck Murdy of Canon-McMillan, and a 10–4 win over Dana Weber of Waynesboro in the final.",
  "Northampton went 24–0 for the second straight year and won its second straight PIAA team title. Coach Don Rohn won his 200th match at Northampton that season and was named AAA Coach of the Year.",
]
finals = [[1994, "Dana Weber", "Waynesboro", "Won 10–4"]]
sources = [["Lehigh Valley Wrestling History, \u201c1993-94: The Kids Are Hot Tonite\u201d", "https://lehighvalleywrestlinghistory.com/1993-94-the-kids-are-hot-tonite/"], ["PA-Wrestling, Northampton state tournament history", "https://brackets.pa-wrestling.com/piaa-class-aaa/history_participating_wrestlers.htm?id=189"]]

["Chad Billy"]
banner = "banner-chad-billy"
story = [
  "Chad Billy won the 1991 PIAA Class AAA title at 112 pounds, the only state champion from the Lehigh Valley that year. He finished his senior season 37–1.",
  "It was the last step of a three-year climb at states: 4th at 103 as a sophomore, 6th at 112 as a junior, and champion as a senior. In 1991 he won the Christmas City Tournament, where Northampton edged Nazareth for the team title by half a point, and swept the District XI and Northeast Regional titles. At Hershey he went 4–0, beating John Bryan of State College 7–4, Gabe Miller of Canon-McMillan 12–6, Jim Gority of Hollidaysburg 5–4 in the semifinal, and Jeff Cervone of Meadville 7–4 in the final.",
  "That season Northampton went 21–2 and won the East Penn Conference at 11–0. Billy finished his career with 102 wins and a spot in the 100-Win Club, and he added a fall for Pennsylvania in its 24–22 win over the USA team at the Pittsburgh Classic.",
]
finals = [[1991, "Jeff Cervone", "Meadville", "Won 7–4"]]
sources = [["Lehigh Valley Wrestling History, \u201c1990-91: Fierce Competition\u201d", "https://lehighvalleywrestlinghistory.com/1990-91-fierce-competition/"], ["PA-Wrestling, Northampton state tournament history", "https://brackets.pa-wrestling.com/piaa-class-aaa/history_participating_wrestlers.htm?id=189"]]

["Sean Finkbeiner"]
banner = "banner-sean-finkbeiner"
story = [
  "Sean Finkbeiner ended a 29-year wait in 1984, becoming Northampton's first state champion since 1955. He won the PIAA title at 145 pounds and finished his senior season a perfect 35–0.",
  "He set the tone early, pinning Northern Lehigh's Greg Parsons at 155 to win the Christmas City Tournament and its Outstanding Wrestler award. In the postseason he edged Allen's Scott Schleicher 3–2 for the District XI title, won the Northeast Regional at Bloomsburg, and then went 4–0 at states: major decisions over Mark Nichols of Canon-McMillan (15–3) and Mario Harpel of Neshaminy (16–3), a 3–2 semifinal over Brad Lloyd of Red Lion, and a 7–2 win over Kurt Bowman of Waynesboro in the final.",
  "He kept winning after the season. At the Easton Lions Classic he beat New Jersey state champion Mike Barna 9–3, he won at the AAA-AA Challenge of Champions, and he was named Outstanding Wrestler at the Pittsburgh Press Classic after a 14–5 win over future Iowa State star Tim Krieger. It was Don Rohn's second season as head coach. Rohn went on to win five PIAA team titles.",
]
finals = [[1984, "Kurt Bowman", "Waynesboro", "Won 7–2"]]
sources = [["Lehigh Valley Wrestling History, \u201c1983-84: Canary Resurgence, Matty Catty\u201d", "https://lehighvalleywrestlinghistory.com/1980s-beyond/1983-84-canary-resurgence-matty-catty/"], ["PA-Wrestling, Northampton state tournament history", "https://brackets.pa-wrestling.com/piaa-class-aaa/history_participating_wrestlers.htm?id=189"]]

["Steve Micio"]
banner = "banner-steve-micio"
story = [
  "Steve Micio became Northampton's first state champion in March 1955, winning the PIAA title at 133 pounds with a 5–4 decision over Bill Milligan of Washington at Penn State's Rec Hall.",
  "He had been building toward it. Micio won District XI titles in 1953 (120) and 1954 (127), and in 1954 he added a Northeast Regional title and finished runner-up at states. He went more than two years unbeaten in Lehigh Valley League duals until late January 1955, when he moved up to 139 and lost 10–6 to Easton's Nido Collina.",
  "Back at 133 for the postseason, he swept the District XI and Northeast Regional titles, then beat Dean Seltzer of Lansdowne-Aldan 4–3 in the state semifinal to reach the final. Under coach Harry Wall, Northampton sent Micio and Ed Keglovits to the state finals that March, and both won. The Kids placed 2nd in the state, the best finish by a District XI team since 1940.",
]
finals = [[1955, "Bill Milligan", "Washington", "Won 5–4"]]
sources = [["Lehigh Valley Wrestling History, \u201c1954-55: Return of the Rovers\u201d", "https://lehighvalleywrestlinghistory.com/the-1950s/1954-55-return-of-the-rovers/"], ["PA-Wrestling, 1955 PIAA state results", "https://brackets.pa-wrestling.com/pdfs/1955_PIAA_State_results.pdf"]]

["Edward Keglovits"]
banner = "banner-edward-keglovits"
story = [
  "Ed Keglovits became Northampton's second state champion on the same March 1955 day at Penn State's Rec Hall that teammate Steve Micio won the program's first. Keglovits took the PIAA title at 154 pounds with a 3–2 decision over Walt \"Bud\" Kottmyer of J.P. McCaskey.",
  "His postseason run was strong from the start. He won the District XI final 8–0 over Easton's Gino DiLorenzo, won the Northeast Regional title at Wilkes-Barre, and beat Ben Cree of Mapletown 8–6 in the state semifinal to reach the final.",
  "During the season he won at 154 in Northampton's 24–16 win over Bethlehem, a match for second place in the Lehigh Valley League. Under coach Harry Wall, the Kids went 7–3 in the league and finished 2nd in District XI and 2nd in the state.",
]
finals = [[1955, "Walt \"Bud\" Kottmyer", "J.P. McCaskey", "Won 3–2"]]
sources = [["Lehigh Valley Wrestling History, \u201c1954-55: Return of the Rovers\u201d", "https://lehighvalleywrestlinghistory.com/the-1950s/1954-55-return-of-the-rovers/"], ["PA-Wrestling, 1955 PIAA state results", "https://brackets.pa-wrestling.com/pdfs/1955_PIAA_State_results.pdf"]]

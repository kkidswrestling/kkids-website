# One entry per state champion (not per title). The key is the name exactly as it
# appears in data/hall/state-champions.csv. Every field is optional; champions with
# no entry still get a page with their full record filled in automatically.
#
#   banner   = photo id for the banner (an action shot)
#   banners  = per-year banner photos for multi-time champions, e.g. { "2017" = "photo-id" }
#   portrait = photo id for the full medal portrait on the champion page
#   hero     = photo id for the big photo at the top of the page
#   story    = paragraphs about the wrestler and the title run
#   finals   = one row per title: [year, "opponent", "opponent school", "result"]
#   gallery  = more photo ids
#   sources  = [["title", "url"], ...] where the story came from (shown under the story)
#   video    = YouTube links to the state final (only videos posted publicly by their owner)

["Gabriel Ballard"]
banner = "banner-gabriel-ballard"
portrait = "portrait-ballard-2026"
hero = "ballard-raised"
story = [
  "Gabe Ballard won the 2026 PIAA Class AAA title at 152 pounds as a junior, finishing the season 41–5 with 15 pins.",
  "It capped a steady climb at Hershey: 4th at 114 as a freshman, runner-up at 127 as a sophomore, and champion at 152. He led the team in takedowns (114) and team points (238), and his 41 wins matched his freshman total on the school's single-season wins list.",
  "Ballard enters his senior season with 121 career wins, already a member of the 100-Win Club.",
]
gallery = ["ballard-attack", "ballard-coaches", "ballard-100", "ballard-ride"]

["Brayden Wenrich"]
banner = "banner-brayden-wenrich"
portrait = "portrait-wenrich-2026"
hero = "wenrich-final"
story = [
  "Brayden Wenrich won the 2026 PIAA Class AAA title at 114 pounds as a sophomore, finishing the season 36–1.",
  "A year earlier he reached the state final at 107 as a freshman, placing 2nd after a 44-win season that put him on the school's single-season wins list. In 2026 he swept the District XI, Northeast Regional, and PIAA titles, recorded the team's fastest pin of the season at 9 seconds, and was never pinned.",
  "He enters his junior season with an 80–7 career record.",
]
gallery = ["wenrich-celebrates", "wenrich-medal", "celebration"]

["Trey Wagner"]

["Dennis Liberto"]
banner = "banner-dennis-liberto"
story = [
  "Denny Liberto won the 1995 PIAA Class AAA title at 103 pounds as a senior, beating Mike Khan of Harrisburg 13–5 in the final. He finished the season 37–1.",
  "He placed at states three straight years: 6th as a sophomore, 3rd as a junior, and champion as a senior, all at 103. He also won three straight District XI and Northeast Regional titles, beating Easton's Bryan Snyder 9–5 in the 1995 district final. At Hershey he won by forfeit, beat Brian Kubistek of Derry Area 13–5, beat Brad Fralic of Cathedral Prep 15–6 in the semifinal, and then beat Khan for the title.",
  "During his senior season he won the Ironman Classic in Ohio and earned his 100th career win at the Bethlehem Holiday Classic. He finished with 128 wins. His title opened a big night for the Kids, who won their third straight PIAA team title in 1995.",
]
finals = [[1995, "Mike Khan", "Harrisburg", "Won 13–5 (major decision)"]]
sources = [["Lehigh Valley Wrestling History, \u201c1994-95: The Year of the Big Three\u201d", "https://lehighvalleywrestlinghistory.com/1994-95-the-year-of-the-big-three/"], ["PA-Wrestling, Northampton state tournament history", "https://brackets.pa-wrestling.com/piaa-class-aaa/history_participating_wrestlers.htm?id=189"]]


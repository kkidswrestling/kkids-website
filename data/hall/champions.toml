# One entry per state champion (not per title). The key is the name exactly as it
# appears in data/hall/state-champions.csv. Every field is optional; champions with
# no entry still get a page with their full record filled in automatically.
#
#   banner   = photo id for the banner (an action shot)
#   banners  = per-year banner photos for multi-time champions, e.g. { "2017" = "photo-id" }
#   portrait = photo id for the full medal portrait on the champion page
#   hero     = photo id for the big photo at the top of the page
#   story    = paragraphs about the wrestler and the title run
#   finals   = one row per title: [year, "opponent", "opponent school", "result"]
#   gallery  = more photo ids
#   sources  = [["title", "url"], ...] where the story came from (shown under the story)
#   video    = YouTube links, or { url = "...", start = "15:30", end = "18:30" } to play one match from a longer video.
#              YouTube links to the state final (only videos posted publicly by their owner)


# Photo catalog. Every photo on the site is listed here once.
#   id       name used in pages (assets/img/photos/<id>-<width>.webp)
#   source   where the original came from, so it can be re-pulled later
#   season   the season the photo is from (only used for season-specific spots)
#   alt      description for screen readers
#   caption  short line shown under the photo or in the gallery (optional)
#   credit   photographer, when the photo carries a watermark or credit
#   crop     [left, top, right, bottom] in source pixels (optional)
#   focus    CSS object-position used when the photo is cropped to fit (optional)
#   file     working path used when (re)processing; ignored when missing


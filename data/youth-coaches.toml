live = "On knees: maintain position."

[[skill]]
level = "orange-black"
position = "bottom"
name = "Escaping from your feet"
teach = ["Leg forward, chest up, pressure back in, wrist, cut through."]
demonstrates = "Escapes from their feet against light resistance."
drill = "2&2 escaping from your feet."

# ------------------------------------------------------------------ Practice plan
# Joe's practice-plan template, adjusted for youth. Same sections, same order as the
# high school plan. Novice does not drill 2&2; Orange & Black does.
[practice]
intro = "Same practice plan the high school room uses, adjusted for youth. Every practice has a written plan. Kids should leave tired, a little better, and excited to come back."
sections = [
  ["Announcements", "Keep it short. Skin check and attendance as kids line up."],
  ["Warm-up", "Movement and games. No lifting at the youth level."],
  ["Drill (review principles)", "3–5 moves already taught, with their key cues. Orange & Black drills 2&2."],
  ["New Technique", "1–2 moves, marked (new). Teach the cues, then lots of reps."],
  ["Contest situation", "Live situations matched by size and experience. Short goes."],
  ["Conditioning", "A conditioning game. Takes the place of CrossFit at the youth level."],
  ["Announcements", "One quick reminder if needed."],
  ["Team Culture", "Spotlight or Observations (“What did you see someone do well?”). Every kid shakes every coach's hand on the way out."],
  ["My notes", "Who owns today's move? Who needs it re-taught next practice?"],
]


# Konkrete Kids trivia (Tradition > Trivia). Built by build_trivia() in tools/build.py.
# Rules (Joe, Oct. 2026): fun and positive; no questions about anyone on the current roster;
# no scores, losses, or anything that pokes at another school; every answer checked against
# our Hall lists, season pages, or Lehigh Valley Wrestling History.
#
# [[round]]  title, blurb, then [[round.q]] entries:
#   q       = the question
#   choices = four answers
#   answer  = position of the right answer in choices (1-4)
#   fact    = shown after answering
#   link    = [label, site path] to read more (optional)

[[round]]
title = "Team Moments"
blurb = "The nights the whole town still talks about."

[[round.q]]
q = "Northampton won three straight PIAA team titles. Which years?"
choices = ["1990, 1991 and 1992", "1993, 1994 and 1995", "1998, 1999 and 2000", "2002, 2003 and 2004"]
answer = 2
fact = "The 1992–93 and 1993–94 teams didn't lose a dual meet, and the 1994–95 team made it three in a row."
link = ["The 1993 title season", "champions/team/1993/"]

[[round.q]]
q = "Northampton's longest dual-meet winning streak spanned three seasons, from 1992–93 into 1994–95. How many straight duals did it reach?"
choices = ["24", "36", "50", "61"]
answer = 3
fact = "Fifty straight: 24–0, then 24–0 again, then the first two duals of 1994–95. National No. 1 Walsh Jesuit of Ohio ended it later that same day, Dec. 10, 1994, at the Valley Youth House Elite Duals."
link = ["The 1994–95 season", "seasons/1994-95/"]

[[round.q]]
q = "In 1993 the Kids beat Nazareth in a dual at Liberty in front of a packed gym. About how many fans were there?"
choices = ["About 900", "About 1,800", "About 3,600", "About 6,000"]
answer = 3
fact = "About 3,600 fans. A year later the Nazareth dual at Stabler Arena drew about the same."
link = ["The 1993 title season", "champions/team/1993/"]

[[round.q]]
q = "How did the town welcome the team home after the 1993 state title?"
choices = ["A bonfire at the high school", "A parade", "A banquet at the fire hall", "A pep rally at Pete Schneider Gymnasium"]
answer = 2
fact = "A parade on March 21, 1993. The superintendent called it one of the greatest moments in Northampton sports history."
link = ["The 1993 title season", "champions/team/1993/"]

[[round.q]]
q = "The 1998 Northeast Regional team title came down to the very last bout. Whose pin won it?"
choices = ["Christian Luciano's", "Phil Hard's", "John Hard's", "Tommy Rohn's"]
answer = 3
fact = "Heavyweight John Hard pinned in the final bout, and Northampton won the regional team title by one point. Then he won the state title at 275."
link = ["The 1998 title season", "champions/team/1998/"]

[[round.q]]
q = "Before the 1998–99 season, Amateur Wrestling News and USA Today ranked Northampton where?"
choices = ["No. 1 in the nation", "No. 1 in Pennsylvania", "No. 3 in the nation", "No. 10 in the nation"]
answer = 1
fact = "No. 1 in the nation. That team won the District XI Duals for the second year in a row."
link = ["The 1998–99 season", "seasons/1998-99/"]

[[round.q]]
q = "In 2000 the Kids set a state record (at the time) for place winners at Hershey. How many?"
choices = ["Five", "Six", "Seven", "Eight"]
answer = 4
fact = "Eight place winners, led by state champion Ryan McCallum. It was Coach Don Rohn's final season."
link = ["The 2000 title season", "champions/team/2000/"]

[[round.q]]
q = "Besides the state tournament title, the 2000 Kids won another state title for the first time. What was it?"
choices = ["The PIAA team duals", "The Beast of the East", "The Walsh Ironman", "The National High School Duals"]
answer = 1
fact = "The PIAA team duals. That made 2000 the program's first season with both state team titles."
link = ["The 2000 title season", "champions/team/2000/"]

[[round.q]]
q = "Northampton won the District XI Duals three years in a row. Which three?"
choices = ["1993, 1994, 1995", "1998, 1999, 2000", "2003, 2004, 2005", "2007, 2008, 2009"]
answer = 2
fact = "That made five District XI Duals titles in eight years, after 1993 and 1994. The Kids have seven in all."
link = ["The 1998–99 season", "seasons/1998-99/"]

[[round.q]]
q = "In a 1991 dual, the Kids trailed Nazareth going into the last bout. Which heavyweight won it with a pin?"
choices = ["John Hard", "Jason Grim", "Zach Musselman", "Jon Oplinger"]
answer = 2
fact = "Jason Grim pinned his man in the final bout to turn a two-point deficit into a win."
link = ["The 1990–91 season", "seasons/1990-91/"]

[[round]]
title = "Champions"
blurb = "The names on the banners."

[[round.q]]
q = "Northampton's first two state titles were won on the same day in 1955, but not in Hershey. Where?"
choices = ["The Palestra in Philadelphia", "Penn State's Rec Hall", "Stabler Arena", "Liberty High School"]
answer = 2
fact = "Penn State's Rec Hall in State College, where Steve Micio and Ed Keglovits both won on March 19, 1955."
link = ["Steve Micio", "champions/steve-micio/"]

[[round.q]]
q = "Steve Micio was one of Northampton's first two state champions in 1955. Who was the other?"
choices = ["Albert Billy", "Gordon Bartholomew", "Ed Keglovits", "Dave Wall"]
answer = 3
fact = "Ed Keglovits won his title the same March day at Rec Hall. Albert Billy was the program's first District XI champion, in 1948."
link = ["Edward Keglovits", "champions/edward-keglovits/"]

[[round.q]]
q = "Four Kids won state titles on the same night in 2003. Which of these was NOT one of them?"
choices = ["Josh Haines", "Jon Oplinger", "Ryan McCallum", "Joey Ecklof"]
answer = 3
fact = "Ryan McCallum won his title in 2000. The 2003 champions were Joey Ecklof, Jeff Ecklof, Josh Haines and Jon Oplinger."
link = ["The 2003 title season", "champions/team/2003/"]

[[round.q]]
q = "After Northampton's first two state titles in 1955, the next one took 29 years. Who won it, in 1984?"
choices = ["Joe Billy", "Sean Finkbeiner", "Mike Bartholomew", "Rick Billy"]
answer = 2
fact = "Sean Finkbeiner won the 1984 title at 145, and it started the medal streak that is still going."
link = ["Sean Finkbeiner", "champions/sean-finkbeiner/"]

[[round.q]]
q = "Two Konkrete Kids won three state titles, each at three different weights. Julian Chlebove is one. Who's the other?"
choices = ["Trey Wagner", "Jeff Ecklof", "Joey Ecklof", "Jon Oplinger"]
answer = 3
fact = "Joey Ecklof won at 135, 145 and 152. Julian Chlebove won at 113, 120 and 132."
link = ["Joey Ecklof", "champions/joey-ecklof/"]

[[round.q]]
q = "Mike Tomsic won the 1993 state final at 112 by fall. How fast?"
choices = ["45 seconds", "1:30", "2:15", "3:40"]
answer = 1
fact = "Forty-five seconds, on the way to Northampton's first PIAA team title."
link = ["Mike Tomsic", "champions/mike-tomsic/"]

[[round.q]]
q = "Which state champion finished his title season a perfect 40–0?"
choices = ["Whitey Chlebove", "Christian Luciano", "Gabe Ballard", "Justin Wieller"]
answer = 2
fact = "Christian Luciano went 40–0 in 1998. Whitey Chlebove also went unbeaten in his title season, 38–0 in 1994."
link = ["Christian Luciano", "champions/christian-luciano/"]

[[round.q]]
q = "Who is Northampton's only state champion at 275?"
choices = ["Jon Oplinger", "John Hard", "Justin Wieller", "Phil Hard"]
answer = 2
fact = "John Hard, 1998. Jon Oplinger (twice) and Justin Wieller won their titles at 215."
link = ["John Hard", "champions/john-hard/"]

[[round.q]]
q = "Four Kids medaled at states all four years of high school. Which of these is NOT one of them?"
choices = ["Christian Luciano", "Dan Moran", "Josh Haines", "Carson Wagner"]
answer = 3
fact = "The four-time medalists are Christian Luciano, Jeff Ecklof, Dan Moran and Carson Wagner. Josh Haines won two state titles."
link = ["Hall of Champions", "champions/#lists-title"]

[[round.q]]
q = "Only one Konkrete Kid has won four District XI titles. Who?"
choices = ["Steve Micio", "Denny Liberto", "Jeff Ecklof", "Dagen Condomitti"]
answer = 3
fact = "Jeff Ecklof, 2000 to 2003. He won four Northeast Regional titles too."
link = ["Jeff Ecklof", "champions/jeff-ecklof/"]

[[round.q]]
q = "Who is the lightest Konkrete Kid ever to win a state title, at 103 pounds?"
choices = ["Mike Tomsic", "Brayden Wenrich", "Denny Liberto", "Chad Billy"]
answer = 3
fact = "Dennis \"Denny\" Liberto won at 103 in 1995 after medaling at 103 the two years before. Chad Billy and Mike Tomsic won at 112."
link = ["Dennis Liberto", "champions/dennis-liberto/"]


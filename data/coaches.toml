# Coaching staff. Order here is the order on the page. (Club officers are not kept here: the repo is public.)

[head]
name = "Joe Provini"
role = "Head Coach"
photo = "coach-provini"
since = "May 2022"
bio = [
  "Joe Provini was named the eighth head coach in Northampton history in May 2022. A 2003 graduate of Nazareth Area High School, he won more than 100 matches as a four-year varsity starter, was a District XI champion, placed 6th at the PIAA Championships, and was named District XI AAA Scholar Athlete as a senior. At Shippensburg University he was a Division II national qualifier on a Red Raiders team that set school records with five national qualifiers and an 8th-place NCAA finish, and crowned the program’s first national champion.",
  "He earned his degree in Secondary Education Social Studies from East Stroudsburg University in 2012 and holds master's degrees in educational leadership and online teaching from Wilkes University. Now in his 15th year in education and his 12th in the Northampton Area School District, he teaches AP English Language and Composition and AP U.S. Government & Politics at Northampton Area High School.",
  "Before taking over at Northampton, he spent 12 seasons as a varsity assistant at his alma mater. In four seasons as Northampton's head coach, his teams are 46–15 and have produced 7 District XI champions, 7 Northeast Regional champions, 11 state placewinners, and 3 State Champions: Trey Wagner (127) in 2024, and Brayden Wenrich (114) and Gabe Ballard (152) in 2026. Northampton has had at least one state finalist in each of his four seasons.",
  "He also started Northampton's girls wrestling program and was its head coach for its first season, going 4–4 and coaching Mylea Lambert, the program's first girls district champion and state placewinner (4th).",
]
# Head-coach results at Northampton through the 2025-26 season
record = "46–15"
seasons = 4
district_champs = 7
regional_champs = 7
state_champs = 3
placewinners = 11

[[varsity]]
name = "Mike Sommer"
role = "Varsity Assistant"
photo = "coach-sommer"
bio = "A 1997 Northampton graduate who started in the NAA youth program, Coach Sommer capped his Konkrete Kid career with a 4th-place finish at the PIAA AAA Championships. At Lycoming College he was a three-time conference placewinner and two-year captain with 97 career wins. After several years coaching at Whitehall, he came home as a volunteer assistant in 2012, became a varsity assistant in 2014, and was named District XI AAA Assistant Coach of the Year in 2019. He teaches 8th grade science at Whitehall Middle School and produces the program’s season highlight video."

[[varsity]]
name = "Jim Derr"
role = "Varsity Assistant"
photo = "coach-derr"
bio = "Coach Derr has coached in the Northampton program since 2001. A 1977 Milton Area graduate, he was a two-time sectional champion, regional runner-up, and PIAA state qualifier. He joined the junior high staff under Keith Venanzi in 2015, when the junior high won two District titles and was ranked No. 1 in Pennsylvania. As junior high head coach from 2020, he led the team to a District title and the No. 1 ranking among Pennsylvania boundary schools, and was named 2022 District XI and PIAA AAA Junior High Coach of the Year."

[[varsity]]
name = "Marcus Newsom"
role = "Varsity Assistant"
photo = "coach-newsom"
bio = "A Northampton alumnus with deep roots in the black and orange, Coach Newsom was a three-year varsity starter under Don Rohn, Terry Daubert, and Seth Lisa. He wants to make athletes better wrestlers and to teach them lessons that last well beyond the mat, and he has been integral to the development of Northampton’s upper weights."

[[varsity]]
name = "Kyle Rusnock"
role = "Varsity Assistant"
photo = "coach-rusnock"
bio = "A 1992 Catasauqua graduate, Coach Rusnock was a four-time state qualifier, three-time state placewinner, and 1992 PIAA state champion before wrestling at the Division I level for the University of Toledo. He is a member of the District XI Wrestling Hall of Fame and the Catasauqua Sports Hall of Fame. He coached at Maumee (Ohio), Pen Argyl, Allen, Parkland, and Catasauqua before joining Northampton. He teaches middle school in the Catasauqua Area School District, where he is also head cross country and track and field coach."

[[varsity]]
name = "John Paukovits"
role = "Varsity Assistant"
photo = ""
bio = "A Northampton alumnus, Coach Paukovits was a three-time District XI champion (2002, 2004, 2005), the 2004 Northeast Regional champion, and a two-time PIAA state placewinner. He joins the varsity staff for 2026–27."

[[varsity]]
name = "Ethan Szerencsits"
role = "Varsity Assistant"
photo = "coach-szerencsits"
bio = "A 2020 Northampton graduate and state qualifier as a senior, Coach Szerencsits wrestled at American University, where he earned a degree in physics. He trains with the team regularly and has been a big part of its recent success."


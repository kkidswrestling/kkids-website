<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaches' Room · Northampton Wrestling</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/icon-32.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Concrete-grey workroom, safety-orange accent, black for match days. Layout: season grid -> day sheet. */
  --bg: #ebe9e5;
  --paper: #ffffff;
  --ink: #18191b;
  --muted: #6c6a65;
  --line: #d8d4cd;
  --accent: #e2570f;
  --accent-soft: #fbe6d9;
  --black: #151617;
  --good: #2f7d4f;
  --warn: #b7791f;
  --bad: #b3261e;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: .01em; text-wrap: balance; margin: 0; }

/* ---------- top bar ---------- */
.top { background: var(--black); color: #fff; position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: .04em; text-transform: uppercase; }
.brand b span { color: var(--accent); }
.brand small { color: #b9b6b0; font-size: 13px; }
.brand .status { margin-left: auto; font-size: 12px; color: #b9b6b0; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { color: #d6d3cd; text-decoration: none; padding: 9px 14px 11px; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: #fff; border-bottom-color: var(--accent); }
main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 60px; }

/* ---------- shared ---------- */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: #b8b3aa; }
a.btn { text-decoration: none; color: var(--ink); }
a.btn.dark, a.btn.primary { color: #fff; }
a.btn[aria-disabled="true"] { opacity: .35; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.dark { background: var(--black); border-color: var(--black); color: #fff; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: #f1efeb; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.chip.lift { background: var(--accent-soft); color: #a63c06; }
.chip.match { background: var(--black); color: #fff; }
.chip.pre { background: #eef2f6; color: #3b5b7a; }
.chip.opt { background: #f3efe2; color: #7a6223; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.muted { color: var(--muted); }
.pagehead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.pagehead h1 { font-size: 34px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.pagehead p { margin: 0; color: var(--muted); }
.pagehead .right { margin-left: auto; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--black); color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 50; max-width: 90vw; }
.empty { padding: 28px; text-align: left; }
.empty h3 { font-size: 22px; margin-bottom: 6px; }

/* ---------- season ---------- */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.dow { display: grid; grid-template-columns: 150px repeat(7, 1fr); gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 0 6px; }
.dow span { padding-left: 4px; }
.week { display: grid; grid-template-columns: 150px repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.wlabel { border-radius: 8px; padding: 8px 10px; color: #fff; display: flex; flex-direction: column; gap: 2px; min-height: 96px; }
.wlabel .wn { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1; }
.wlabel .wd { font-size: 12px; opacity: .85; }
.wlabel .wp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .85; margin-top: auto; }
.pillar { font-weight: 700; font-size: 13px; background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 5px; padding: 3px 8px; text-align: left; }
.pillar.blank { opacity: .75; font-weight: 500; font-style: italic; }
.cell { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 7px; min-height: 96px; display: flex; flex-direction: column; gap: 3px; text-align: left; position: relative; overflow: hidden; }
button.cell:hover { border-color: #a9a39a; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.cell .dn { font-weight: 700; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.cell .dn em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 12px; }
.cell .sum { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cell.lift { box-shadow: inset 0 4px 0 var(--accent); }
.cell.match { background: var(--black); border-color: var(--black); color: #fff; }
.cell.match .sum { color: #d6d3cd; }
.cell.match .dn em { color: #b9b6b0; }
.cell.none { background: transparent; border-style: dashed; }
.cell.none .dn { color: #a29e97; }
.cell.off { background: repeating-linear-gradient(135deg, #f4f2ee 0 6px, #ebe8e3 6px 12px); }
.cell.today { outline: 3px solid var(--accent); outline-offset: -1px; }
.cell .tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.cell .tag.l { color: var(--accent); }
.cell .tag.m { color: var(--accent); }
.cell .tag.p { color: #3b5b7a; }
.cell .att { position: absolute; right: 7px; top: 7px; font-size: 11px; font-weight: 700; color: var(--good); }

/* phone agenda */
.agenda { display: none; }
@media (max-width: 760px) {
  .dow, .week { display: none; }
  .agenda { display: flex; flex-direction: column; gap: 14px; }
  .pagehead h1 { font-size: 28px; }
}
.aweek { overflow: hidden; }
.aweek header { color: #fff; padding: 10px 12px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.aweek header b { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
.aweek header .pillar { margin-left: auto; }
.arow { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: center; text-align: left; background: var(--paper); border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.arow .ad { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.05; }
.arow .ad small { display: block; color: var(--muted); font-family: var(--font-body); font-weight: 600; font-size: 11px; text-transform: uppercase; }
.arow .at { font-size: 14px; }
.arow .at span { color: var(--muted); display: block; font-size: 12.5px; }
.arow.match { background: var(--black); color: #fff; }
.arow.match .at span, .arow.match .ad small { color: #c9c6c0; }
.arow.lift { box-shadow: inset 4px 0 0 var(--accent); }

/* ---------- day sheet ---------- */
.daynav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.daynav .spacer { flex: 1; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sheethead { padding: 18px 22px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: end; }
.eyebrow { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.sheethead h1 { font-size: 38px; font-weight: 800; line-height: 1; text-transform: uppercase; }
.sheethead .sub { color: var(--muted); font-weight: 500; }
.sheethead .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pillarband { background: var(--black); color: #fff; padding: 9px 22px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.pillarband b { font-family: var(--font-display); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
.pillarband span { color: #b9b6b0; font-size: 13px; }
.pillarband .win { margin-left: auto; color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .04em; }
.note { margin: 14px 22px 0; padding: 10px 12px; border-radius: 8px; background: #f3efe2; color: #6a5420; font-size: 14px; }
.timeline { display: flex; margin: 16px 22px 4px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.tblock { padding: 8px 9px; border-right: 1px solid var(--line); min-width: 0; background: #faf9f7; }
.tblock:last-child { border-right: 0; }
.tblock .tt { font-size: 11.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tblock .tn { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.1; }
.tblock .tx { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tblock.hot { background: var(--accent-soft); }
.tblock.water { background: #e7f1fb; } .tblock.water .tn { color: #2e5f8a; }
.tblock.hot .tn { color: #a63c06; }
@media (max-width: 760px) {
  .timeline { flex-direction: column; }
  .tblock { flex: none !important; border-right: 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 92px 1fr; gap: 0 8px; }
  .tblock:last-child { border-bottom: 0; }
  .tblock .tt { grid-row: span 2; padding-top: 2px; }
  .sheethead { grid-template-columns: 1fr; }
  .sheethead .chips { justify-content: flex-start; }
  .sheethead h1 { font-size: 30px; }
}
.cols { columns: 2; column-gap: 34px; padding: 14px 22px 24px; }
@media (max-width: 860px) { .cols { columns: 1; } .sec .two { columns: 1 !important; } }
.sec { break-inside: avoid; margin: 12px 0 4px; }
.sec.long { break-inside: auto; }
.sec h3 { font-family: var(--font-body); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding-bottom: 4px; border-bottom: 2px solid var(--ink); display: flex; gap: 8px; align-items: baseline; }
.sec h3 .mv { margin-left: auto; display: inline-flex; gap: 6px; }
.mvb { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 7px; background: #fff; font-size: 17px; font-weight: 800; line-height: 1; color: var(--ink); cursor: pointer; }
.mvb:active { background: #f1eee9; }
.sec h3 small { white-space: nowrap; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: none; font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.sec ul { margin: 6px 0 0; padding-left: 18px; }
.sec ul ul { padding-left: 18px; margin-top: 2px; list-style: circle; }
.sec ul ul ul { list-style: square; }
.sec li { margin: 2px 0; }
.sec ul.check { list-style: none; padding-left: 0; }
.sec ul.check > li { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; align-items: start; margin: 5px 0; }
.sec ul.check > li > ul { grid-column: 2; }
.box { width: 22px; height: 22px; border: 2px solid #9e988e; border-radius: 5px; background: #fff; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; line-height: 1; margin-top: 1px; }
.box.on { background: var(--good); border-color: var(--good); }
.box[disabled] { cursor: default; }
li.done > .txt { color: var(--muted); }
.carry { margin: 8px 0 4px; padding: 6px 10px 4px; background: #fff6ec; border: 1px dashed #e9b48f; border-radius: 8px; }
.carry .cl { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #a63c06; }
.prog { font-size: 12px; font-weight: 700; color: var(--good); margin-left: 8px; letter-spacing: 0; text-transform: none; }
.sec li.rot { list-style: none; margin-left: -18px; font-weight: 700; color: #a63c06; background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; margin-bottom: 6px; }
.sec li.why { list-style: none; margin-left: -18px; color: var(--muted); font-style: italic; }
.sec .two { columns: 2; column-gap: 18px; }
.sec .emptyline { color: #a8a39b; font-style: italic; margin-top: 6px; }
.sec textarea { width: 100%; min-height: 120px; margin-top: 6px; border: 1px solid #c9c3b9; border-radius: 8px; padding: 8px 10px; font-size: 14px; line-height: 1.45; resize: vertical; background: #fffdf9; }
.edithint { margin: 12px 22px 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: #7a3206; font-size: 14px; }
.edited { font-size: 12px; color: var(--muted); }

/* ---------- attendance ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
select.pick { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; max-width: 100%; }
.tally { display: flex; gap: 8px; flex-wrap: wrap; }
.tally div { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.tally b { font-family: var(--font-display); font-size: 22px; color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }
.roll { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px; }
.rollrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.rollrow .nm { flex: 1; min-width: 0; font-weight: 600; }
.rollrow .nm small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: #faf9f7; padding: 7px 10px; font-weight: 700; font-size: 13px; color: var(--muted); min-width: 38px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on.P { background: var(--good); color: #fff; }
.seg button.on.L { background: var(--warn); color: #fff; }
.seg button.on.E { background: #3b5b7a; color: #fff; }
.seg button.on.A { background: var(--bad); color: #fff; }
.rollrow { flex-wrap: wrap; }
.rollrow .attn { display: block; margin-top: 3px; padding: 2px 0; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: #9a958c; text-align: left; cursor: pointer; max-width: 100%; overflow-wrap: anywhere; }
.rollrow .attn.want { color: var(--accent); }
.rollrow .attn.has { color: #6b4a1f; font-weight: 500; font-style: italic; }
.rollrow .attn.has::before { content: '✎ '; font-style: normal; }
.rollrow.open { border-color: var(--accent); }
.attedit { flex-basis: 100%; display: grid; gap: 8px; padding-top: 6px; }
.attedit .attin { width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.attedit .attin:focus { outline: none; border-color: var(--accent); }
.attedit .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.attedit .chip { border: 1px solid var(--line); background: #faf9f7; border-radius: 99px; padding: 6px 11px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
.attedit .chip:active { background: #f1ece4; }
ul.attlog { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
ul.attlog li { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; padding: 8px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
ul.attlog .mk { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
ul.attlog .mk.L { color: var(--warn); } ul.attlog .mk.A { color: var(--bad); } ul.attlog .mk.E { color: #3b5b7a; }
table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
table.grid th, table.grid td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.grid th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
table.grid a { color: var(--ink); font-weight: 600; text-decoration-color: #c9c3b9; }
table.grid td.num { font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.bar { height: 6px; background: #eeeae4; border-radius: 99px; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--good); }
h2.sect { font-size: 22px; font-weight: 800; text-transform: uppercase; margin: 26px 0 10px; }

/* ---------- lifts ---------- */
.stations { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.stations span { background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-weight: 600; }
.stations span.first { background: var(--accent); border-color: var(--accent); color: #fff; }
.lifter { padding: 12px 14px; display: grid; grid-template-columns: 180px repeat(5, 1fr); gap: 10px; align-items: start; }
.lifter + .lifter { border-top: 1px solid var(--line); }
.lifter .who { font-weight: 700; }
.lifter .who a { color: inherit; text-decoration-color: #c9c3b9; }
.lifter .who small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.liftbox { display: flex; flex-direction: column; gap: 4px; }
.liftbox label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.liftbox .ins { display: flex; gap: 4px; align-items: center; }
.liftbox input { width: 100%; min-width: 0; padding: 7px 6px; border: 1px solid var(--line); border-radius: 6px; font-variant-numeric: tabular-nums; text-align: center; background: #fff; }
.liftbox .x { color: var(--muted); font-size: 12px; }
.liftbox .last { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.liftbox .last.up { color: var(--good); font-weight: 700; }
.fran { display: flex; gap: 6px; align-items: center; grid-column: 2 / -1; font-size: 13px; }
.fran input { width: 90px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; text-align: center; }
@media (max-width: 860px) {
  .lifter { grid-template-columns: 1fr 1fr; }
  .lifter .who { grid-column: 1 / -1; }
  .fran { grid-column: 1 / -1; }
}

/* ---------- roster ---------- */
.formrow { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
.formrow label, .stack label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; flex-direction: column; gap: 4px; }
.formrow input, .formrow select, .stack textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink); font-size: 15px; }
.stack textarea { min-height: 120px; width: 100%; }
@media (max-width: 760px) { .formrow { grid-template-columns: 1fr 1fr; } .formrow label:first-child { grid-column: 1 / -1; } }
.pad { padding: 16px; }
.inactive td { color: #aaa49b; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }

/* ---------- library ---------- */
.libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.libcard { padding: 12px 14px; border-left: 5px solid var(--accent); }
.libcard.Finisher { border-left-color: var(--black); }
.libcard.Light { border-left-color: #3b5b7a; }
.libcard h3 { font-size: 20px; font-weight: 700; }
.libcard p { margin: 4px 0 6px; font-size: 14px; }
.libcard .used { font-size: 12px; color: var(--muted); }
.libcard .used a { color: var(--ink); text-decoration-color: #c9c3b9; }
.phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.phase { padding: 12px 14px; color: #fff; border-radius: var(--r); }
.phase h3 { font-size: 22px; font-weight: 800; text-transform: uppercase; }

const claudeRosterBusy = new Set();
function applyClaudeRoster() {
  const list = DATA.claudeRoster || []; if (!list.length || !Object.keys(st.roster).length) return;
  const key = n => String(n || '').toLowerCase().replace(/[^a-z]/g, '');
  for (const c of list) {
    const hit = Object.entries(st.roster).find(([, r]) => key(r.name) === key(c.name));
    if (!hit) {
      const nid = 'claude-' + c.key;
      if (!c.add || st.roster[nid] || claudeRosterBusy.has(c.key) || (c.until && todayIso() > c.until)) continue;
      claudeRosterBusy.add(c.key);
      const rec = Object.assign({ name: c.name, wt: '', grade: '', level: '', active: true }, c.set || {}, { claudeDone: [c.key] });
      st.roster[nid] = rec; write('roster/' + nid, rec).then(() => toast(c.toast || (c.name + ' added to the roster')));

}

// paste: Word / Google Docs lists keep their levels
function olParseHtml(html) {

  doc.querySelectorAll('[style*="mso-list:Ignore"],[style*="mso-list: Ignore"]').forEach(x => x.remove());
  const els = [...doc.body.querySelectorAll('li, p, h1, h2, h3, h4, div')].filter(e => !e.querySelector('li, p, div, h1, h2, h3, h4') || e.tagName === 'LI');
  let listy = false;
  for (const e of els) {
    if (e.tagName !== 'LI' && e.closest('li')) continue;
    const t = e.textContent.replace(/ /g, ' ').replace(/\s+/g, ' ').trim().replace(/^[•●○◦▪■§·]\s*/, ''); if (!t) continue;
    let lv = 0;

}
function olParseText(txt) {

    if (m) { g = /[○◦o]/.test(m[1]) ? 1 : /[■▪§]/.test(m[1]) ? 2 : 0; t = t.slice(m[0].length); }

}
function olInsert(r, items) {

  for (const it of items.slice(first)) {
    const lv = Math.min(OL_MAX, Math.max(0, Math.min(base + it.lv - min, prevLv + 1)));
    const nr = olMake(lv, it.t); at.after(nr); at = nr; last = nr; prevLv = lv; olFit(nr);

/* ---------------- Claude's additions ---------------- */
function lineKey(t) { return String(t || '').toLowerCase().replace(/\((new|carried over[^)]*)\)/g, '').replace(/[^a-z0-9&/]+/g, ' ').trim(); }
function sameLines(a, b) { const f = n => olFlat(n || [], 0, []).map(r => lineKey(r.t)).filter(Boolean).sort().join('|'); return f(a) === f(b); }
function claudeAddsHtml(s) {
  const day = dayByDate[s]; const adds = (day && day.claudeAdds) || []; const ov = st.plans[s]; const done = (ov && ov.addsDone) || [];
  const cur = rawPlan(s).sections;
  return adds.filter(a => !done.includes(a.id) && (!a.replace || Object.entries(a.sections || {}).every(([k, n]) => sameLines(cur[k], n)))).map(a => {
    if (a.replace) {
      const parts = Object.entries(a.sections || {}).map(([k, nodes]) => { const sec = SEC.find(x => x[0] === k); return `<details class="caddsec"><summary>See the new <b>${esc(sec ? secTitle(k, sec[1], rawPlan(s)) : k)}</b></summary>${ul(nodes)}</details>`; }).join('');
      return `<div class="cadd"><div class="caddh"><span class="caddtag">From Claude</span><b>${esc(a.title)}</b></div>${a.why ? `<p class="muted">${esc(a.why)}</p>` : ''}${parts}<div class="row"><button class="btn primary" data-act="cadd" data-id="${esc(a.id)}">Use this version</button><button class="btn ghost" data-act="cskip" data-id="${esc(a.id)}">No thanks</button></div></div>`;
    }
    const parts = Object.entries(a.sections || {}).map(([k, nodes]) => { const sec = SEC.find(x => x[0] === k); return `<div class="caddsec">Goes at the end of <b>${esc(sec ? secTitle(k, sec[1], rawPlan(s)) : k)}</b>, under what you already have:</div>${ul(nodes)}`; }).join('');
    return `<div class="cadd"><div class="caddh"><span class="caddtag">From Claude</span><b>${esc(a.title)}</b></div>${a.why ? `<p class="muted">${esc(a.why)}</p>` : ''}${parts}<div class="row"><button class="btn primary" data-act="cadd" data-id="${esc(a.id)}">Add to plan</button><button class="btn ghost" data-act="cskip" data-id="${esc(a.id)}">No thanks</button></div></div>`;
  }).join('');
}
async function claudeAdd(s, id, add) {
  const day = dayByDate[s]; const a = ((day && day.claudeAdds) || []).find(x => x.id === id); if (!a) return;

  if (add || st.plans[s]) Object.assign(rec, { sections, clock: (ov.clock || p.clock), updatedAt: new Date().toISOString() });
  st.plans[s] = rec; render(); await write('plans/' + s, rec); toast(add ? (a.replace ? 'Updated the plan' : 'Added to the plan') : 'Okay, left it off');
}

/* ---------------- copy the plan as text ---------------- */
function planText(s) {
  const p = plan(s); const lines = [long(s) + (p.label ? ' · ' + p.label : ''), ''];
  lines.push('SCHEDULE'); p.clock.forEach(b => lines.push(b.filter(Boolean).join('  ·  '))); lines.push('');
  const walk = (nodes, d) => (nodes || []).forEach(n => { lines.push('    '.repeat(d) + '- ' + n.t); walk(n.c, d + 1); });
  for (const [k, title] of secOrder(p)) { const nodes = p.sections[k] || []; if (!nodes.length) continue; lines.push(secTitle(k, title, p).toUpperCase()); walk(nodes, 0); lines.push(''); }
  return lines.join('\n').trim() + '\n';
}
async function copyPlan(s) {
  const txt = planText(s);
  try { await navigator.clipboard.writeText(txt); toast('Copied. Paste it anywhere.'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px'; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); toast(ok ? 'Copied. Paste it anywhere.' : 'Copy didn’t work on this device.');
}

/* ---------------- matches ---------------- */
const HOW = ['Fall', 'Tech fall', 'Major', 'Decision', 'Forfeit', 'Inj/DQ'];
const BONUS = ['Fall', 'Tech fall', 'Major', 'Forfeit', 'Inj/DQ'];
function secs(t) { const m = String(t).trim().match(/^(\d+):(\d{1,2})$/); return m ? +m[1] * 60 + +m[2] : (/^\d+(\.\d+)?$/.test(String(t).trim()) ? +t : null); }

function eventsList() {
  const evs = Object.entries(DATA.events).map(([d, e]) => ({ id: d, date: d, title: e[1], kind: e[0], time: e[2] }));
  Object.entries(st.matches).forEach(([id, m]) => { if (m.custom && !evs.find(e => e.id === id)) evs.push({ id, date: m.date, title: m.title, kind: 'Other', time: '' }); });
  return evs.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

    const want = !cur[k0];
    const down = k => { cur[k] = want; ((CHK[k] && CHK[k].kids) || []).forEach(down); }; down(k0);
    let up = CHK[k0] && CHK[k0].parent; while (up) { cur[up] = CHK[up].kids.every(c => cur[c]); up = CHK[up].parent; }
    tree.forEach(k => { if (cur[k] !== !!done[k]) { if (cur[k]) done[k] = true; else delete done[k]; sets.push([['done', k], cur[k] ? true : null]); } });
    st.progress[s] = { done }; render(); if (sets.length) await patch('progress/' + s, sets); return;
  }
  if (t.dataset.mark) {
    const s = selAttDate; const cur = Object.assign({}, (st.attendance[s] && st.attendance[s].marks) || {});
    if (cur[t.dataset.mark] === t.dataset.v) delete cur[t.dataset.mark]; else cur[t.dataset.mark] = t.dataset.v;
    st.attendance[s] = Object.assign({}, st.attendance[s], { marks: cur }); render();
    await patch('attendance/' + s, [[['marks', t.dataset.mark], cur[t.dataset.mark] || null]]); return;
  }
  const act = t.dataset.act; const s = route().slice(4);
  if (act === 'blankweigh') { t.disabled = true; try { await blankWeighPdf(selWeighDate); } finally { t.disabled = false; } return; }
  if (act === 'weighpdf' || act === 'liftpdf') { t.disabled = true; try { await sheetPdf(act === 'weighpdf' ? 'weigh' : 'lift'); } finally { t.disabled = false; } return; }
  if (act === 'addbout') { openBout(route().slice(2)); return; }
  if (act === 'cftimes') { openCF(route().slice(4)); return; }
  if (act === 'cfenter' && cfSort) { openCF(cfSort); return; }
  if (act === 'cfpdf') { t.disabled = true; try { await cfPdf(); } finally { t.disabled = false; } return; }
  if (act === 'newevent') { openNewEvent(); return; }
  if (act === 'swtoggle') { if (sw.on) { sw.acc += Date.now() - sw.t0; sw.on = false; } else { sw.t0 = Date.now(); sw.on = true; } swSave(); return; }
  if (act === 'swreset') { sw = { on: false, acc: 0, t0: 0 }; swSave(); return; }
  if (act === 'runnext' && run) { run.follow = false; run.idx++; run.started = Date.now(); render(); return; }
  if (act === 'runprev' && run) { run.follow = false; run.idx = Math.max(0, run.idx - 1); run.started = Date.now(); render(); return; }
  if (act === 'mv') { moveSec(t.dataset.k, +t.dataset.d); return; }
  if (act === 'attnote') { attNoteOpen = t.dataset.id; render(); const i = document.querySelector('.attin[data-id="' + t.dataset.id + '"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  if (act === 'attchip') { const i = document.querySelector('.attin[data-id="' + t.dataset.id + '"]'); const v = i && i.value.trim() ? i.value.trim() + '; ' + t.dataset.v : t.dataset.v; if (i) i.value = v; await saveAttNote(t.dataset.id, v); render(); return; }
  if (act === 'attnoteclose') { const i = document.querySelector('.attin[data-id="' + t.dataset.id + '"]'); attNoteOpen = null; if (i) await saveAttNote(t.dataset.id, i.value); render(); return; }
  if (act === 'attnoteclear') { attNoteOpen = null; await saveAttNote(t.dataset.id, ''); render(); return; }
  if (act === 'shareboard') { await shareBoard(); return; }
  if (act === 'oladd') { const ol = document.querySelector('[data-ol="' + t.dataset.k + '"]'); if (ol) { const rows = ol.querySelectorAll('.olr'); const last = rows[rows.length - 1]; const ta = last && last.querySelector('.olt'); if (ta && !ta.value.trim()) { ta.focus(); return; } const r = olMake(0, ''); ol.appendChild(r); olFit(r); r.querySelector('.olt').focus(); } return; }
  if (act === 'cadd' || act === 'cskip') { await claudeAdd(s, t.dataset.id, act === 'cadd'); return; }
  if (act === 'copyplan') { await copyPlan(s); return; }
  if (act === 'edit') { editing = s; render(); }
  else if (act === 'cancel') { editing = null; render(); }
  else if (act === 'save') {
    const p = rawPlan(s); const sections = {};
    for (const [k] of SEC) sections[k] = document.querySelector('[data-ol="' + k + '"]') ? fromOl(k) : (p.sections[k] || []);
    const clk = clockFromText($('#ed-clock').value);
    const keep = st.plans[s] && st.plans[s].addsDone ? { addsDone: st.plans[s].addsDone } : {};
    editing = null; st.plans[s] = Object.assign(keep, { sections, clock: clk.length ? clk : p.clock, updatedAt: new Date().toISOString() }); render();
    await write('plans/' + s, st.plans[s]); toast('Plan saved');
  }
  else if (act === 'approve') { const ov = Object.assign({}, st.plans[s], { approved: true }); st.plans[s] = ov; render(); await write('plans/' + s, ov); toast('Approved'); }
  else if (act === 'reset') { openConfirm('Reset this plan?', 'Your changes to this day go away and the original plan comes back.', async () => { editing = null; delete st.plans[s]; render(); await remove('plans/' + s); toast('Plan reset'); }); }
  else if (act === 'print') { printPlan(s); }
  else if (act === 'pdf') { t.disabled = true; try { await makePdf(s); } finally { t.disabled = false; } }
  else if (act === 'allP') {
    const had = (st.attendance[selAttDate] || {}).marks || {}; const sets = roster().filter(x => !had[x.id]).map(x => [['marks', x.id], 'P']);
    if (sets.length) await patch('attendance/' + selAttDate, sets);
  }
  else if (act === 'bulk') {
    const lines = $('#bulk').value.split('\n').map(l => l.trim()).filter(Boolean); let n = 0;
    for (const l of lines) {
      const parts = l.split(/\t|,/).map(s => s.trim());
      let name = parts[0], rest = parts.slice(1);
      if (rest.length && !/\d/.test(rest[0]) && !/^(varsity|jv)$/i.test(rest[0])) { name = rest[0] + ' ' + parts[0]; rest = rest.slice(1); }
      const nums = rest.filter(x => /^\d+$/.test(x)); const lvl = rest.find(x => /^(varsity|jv|v)$/i.test(x));
      const id = uid(); const rec = { name, wt: nums[0] || '', grade: nums[1] || '', level: lvl ? (/^jv$/i.test(lvl) ? 'JV' : 'Varsity') : '', active: true };
      st.roster[id] = rec; await write('roster/' + id, rec); n++;
    }
    toast(n + ' wrestlers added'); render();
  }
});
document.addEventListener('input', e => { if (e.target.id === 'wfind') { weighFilter = e.target.value; const pos = e.target.selectionStart; render(); const f = $('#wfind'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.weigh) {
    e.preventDefault(); const all = [...document.querySelectorAll('[data-weigh]')]; const i = all.indexOf(e.target);
    e.target.blur(); setTimeout(() => { const nx = [...document.querySelectorAll('[data-weigh]')][i + 1]; if (nx) { nx.focus(); nx.select(); } }, 60);
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'addw') return; e.preventDefault();
  const name = $('#nw-name').value.trim(); if (!name) return;
  const id = uid(); const rec = { name, wt: $('#nw-wt').value.trim(), grade: $('#nw-grade').value.trim(), level: $('#nw-level').value, active: true };
  st.roster[id] = rec; render(); await write('roster/' + id, rec); setTimeout(() => { const n = $('#nw-name'); if (n) n.focus(); }, 30);
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'follow' && run) { run.follow = t.checked; run.started = Date.now(); render(); return; }
  if (t.id === 'sfrom') { sheetFrom = +t.value; render(); return; }
  if (t.id === 'sto') { sheetTo = +t.value; render(); return; }
  if (t.id === 'slift') { sheetLift = t.value; render(); return; }
  if (t.id === 'wdate') { selWeighDate = t.value; render(); return; }
  if (t.dataset.weigh) {
    const id = t.dataset.weigh, s = selWeighDate, v = t.value.trim().replace(/[^0-9.]/g, '');
    const key = wKey(s, id); const doc = { d: s, id, w: v, at: new Date().toISOString() };
    st.weighins[key] = doc;
    try { if (v === '') await remove('weighins/' + key); else await write('weighins/' + key, doc); } catch (e) {}
    if (!$('#app').contains(document.activeElement) || !/INPUT/.test(document.activeElement.tagName)) render(); else deferRender = true;
    return;
  }
  if (t.id === 'attdate') { selAttDate = t.value; render(); return; }
  if (t.id === 'liftdate') { selLiftDate = t.value; render(); return; }
  if (t.id === 'cfshow') { cfShow = t.value; cfSort = null; render(); return; }
  if (t.id === 'cfsort') { cfSort = t.value; render(); return; }
  if (t.dataset.lift) {
    const id = t.dataset.lift, s = selLiftDate; const rec = JSON.parse(JSON.stringify(st.lifts[id] || {})); rec.log = rec.log || {}; rec.log[s] = rec.log[s] || {};
    const v = rec.log[s][t.dataset.k] = rec.log[s][t.dataset.k] || {}; v[t.dataset.f] = t.value.trim();
    await patch('lifts/' + id, [[['log', s, t.dataset.k, t.dataset.f], t.value.trim()]]); return;
  }
  if (t.dataset.wf) {
    const id = t.dataset.id; if (t.dataset.wf === 'name' && !t.value.trim()) { t.value = st.roster[id].name; toast('A name is required'); return; } const rec = Object.assign({}, st.roster[id]); rec[t.dataset.wf] = t.value.trim(); st.roster[id] = rec; await write('roster/' + id, rec); toast('Saved'); return;
  }
  if (t.dataset.fran) {
    const id = t.dataset.fran, s = selLiftDate; const doc = JSON.parse(JSON.stringify(st.cf[s] || { workout: 'Fran', times: {} })); doc.times = doc.times || {}; if (t.value.trim()) doc.times[id] = t.value.trim(); else delete doc.times[id];
    await patch('cf/' + s, [[['workout'], doc.workout || 'Fran'], [['times', id], t.value.trim() || null]]);
  }
});

/* ---------------- dialogs ---------------- */
function closeLayer() { $('#layer').innerHTML = ''; }
function openPillar(w) {
  $('#layer').innerHTML = `<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pt"><h2 id="pt">Week ${w} Foundation block</h2><p class="muted">Shows on every practice plan this week.</p><div class="stack"><label for="pv">Foundation block</label><input id="pv" value="${esc(pillar(w))}" style="padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;font-size:16px"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-close="1">Cancel</button><button class="btn primary" id="psave">Save</button></div></div></div>`;
  $('#pv').focus();
  $('#psave').onclick = async () => { const v = $('#pv').value.trim(); const weeks = Object.assign({}, DEFAULT_PILLARS, st.pillars); weeks[String(w)] = v; closeLayer(); st.pillars = weeks; render(); await write('settings/pillars', { weeks }); };
}
function openConfirm(title, body, ok) {
  $('#layer').innerHTML = `<div class="scrim" data-close="1"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close="1">Cancel</button><button class="btn primary" id="cok">Yes, reset</button></div></div></div>`;
  $('#cok').onclick = () => { closeLayer(); ok(); };
}
$('#layer').addEventListener('click', e => { if (e.target.dataset.close) closeLayer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLayer(); });

/* ---------------- boot ---------------- */
let SEED = null;
const b64u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openSeason(k) {
  const enc = await (await fetch('season.json?v=52aa57085e', { cache: 'no-cache' })).json();
  const key = await crypto.subtle.importKey('raw', b64u(k), 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(enc.iv) }, key, b64u(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function gate(msg) {
  $('#tabs').hidden = true; $('#who').hidden = true; $('#sync').hidden = true; $('#status').textContent = '';
  $('#app').innerHTML = `<form class="card gate" id="gate" autocomplete="off"><h1>Coaches’ Room</h1><p class="muted" style="margin:0">Northampton Wrestling coaches only. Practice plans, weigh-ins, attendance, lifts, CrossFit times and matches, all in one place.</p>
    <label>Your name<input id="g-name" placeholder="Coach Derr" value="${esc(coachName)}" autocomplete="name"></label>
    <label>Coach passcode<input id="g-code" type="password" autocomplete="current-password" required></label>
    <p class="err" id="g-err">${esc(msg || '')}</p><button class="btn primary" type="submit" id="g-go">Sign in</button>
    <p class="muted" style="font-size:13px;margin:14px 0 0">Ask Coach Provini for the passcode. This phone stays signed in.</p></form>`;
  $('#gate').onsubmit = async ev => {
    ev.preventDefault(); const btn = $('#g-go'); btn.disabled = true; btn.textContent = 'Checking…'; $('#g-err').textContent = '';
    passcode = $('#g-code').value; coachName = $('#g-name').value.trim();
    try {
      const res = await api({ action: 'login' });
      if (!res.ok) { passcode = null; $('#g-err').textContent = res.error === 'passcode' ? 'That passcode isn’t right.' : 'Something went wrong. Try again.'; btn.disabled = false; btn.textContent = 'Sign in'; return; }
      LS.set('kk_code', passcode); LS.set('kk_role', res.role); LS.set('kk_k', res.k); LS.set('kk_name', coachName); role = res.role;
      start(res.k);
    } catch (e) { passcode = null; $('#g-err').textContent = 'Can’t reach the team’s data. Check the signal and try again.'; btn.disabled = false; btn.textContent = 'Sign in'; }
  };
  setTimeout(() => { const n = $(coachName ? '#g-code' : '#g-name'); if (n) n.focus(); }, 50);
}
function signOut(msg) {
  if (outbox.length && !msg && !confirm(outbox.length + ' entries haven’t reached the team’s data yet. Sign out anyway?')) return;
  ['kk_code', 'kk_role', 'kk_k', 'kk_outbox'].forEach(LS.del); location.hash = ''; passcode = null;
  if (msg) { outbox = []; } location.reload();
}
async function start(k) {
  try { const all = await openSeason(k); SEED = all.seed || null; delete all.seed; DATA = all; }
  catch (e) { gate(!(window.crypto && crypto.subtle) ? 'This page needs a secure connection. Open https://www.northamptonwrestling.org/staff/' : 'The season didn’t open (' + ((e && e.message) || e) + '). Sign in again.'); return; }
  DATA.days.forEach(d => { dayByDate[d.date] = d; });
  canEdit = role === 'head'; canEnter = true; isOwner = canEdit;
  $('#tabs').hidden = false;
  const who = $('#who'); who.hidden = false; who.textContent = 'Sign out'; who.onclick = () => signOut();
  setStatus(); syncPill(); render(); subscribe();
}
downloads = { save: async ({ filename, data }) => { const u = URL.createObjectURL(data); const a = document.createElement('a'); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000); } };
function boot() {
  if (location.protocol === 'http:' && !/^(localhost|127\.)/.test(location.hostname)) { location.replace('https://' + location.host + location.pathname + location.search + location.hash); return; }
  const k = LS.get('kk_k');
  if (passcode && role && k) start(k); else gate();
}
boot();
})();
